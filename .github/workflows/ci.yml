name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrations match schema
        run: pnpm --filter @cortex/db check

      - name: Dashboard build
        run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  whatsapp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build + test the WhatsApp bridge (CGO)
        working-directory: services/whatsapp-bridge
        run: |
          go build ./...
          go test ./...
